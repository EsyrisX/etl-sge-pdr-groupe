services:
  postgres:
    image: postgres:16
    container_name: sge-postgres
    environment:
      POSTGRES_DB: supermarches
      POSTGRES_USER: hop
      POSTGRES_PASSWORD: hop
    ports:
      # 5433 côté machine : le 5432 est souvent occupé par une
      # installation native de PostgreSQL
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - sge-data:/var/lib/postgresql/data

volumes:
  sge-data:
